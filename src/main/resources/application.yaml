spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: erp
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        "[spring.json.value.default.type]": com.bm.erp.order.event.OrderCreatedEvent
        "[spring.json.trusted.packages]": com.bm.erp.order.event

  application:
    name: erp

  datasource:
    url: jdbc:postgresql://localhost:5432/bm_erp
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

jwt:
  secret: +7a7w/+pB2UO4Ac68p7KW8LGzLbYxKS4/l5OShC3T7E=
  expiration: 3600000

logging:
  level:
    org.springframework.security: DEBUG


nfe:
  base-url: https://jsonplaceholder.typicode.com
